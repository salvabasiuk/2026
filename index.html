<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Regressivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            color: white;
            margin: 0;
        }
        #contador {
            font-size: 3rem;
            font-weight: bold;
            background: #1e222b;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="contador">00:10</div>

    <script>
        // 1. Definir o tempo inicial em segundos (ex: 10 segundos)
        let tempoRestante = 10; 

        // 2. Pegar o elemento HTML onde o tempo será exibido
        const display = document.getElementById('contador');

        // 3. Criar a função que atualiza o cronômetro
        const contagemRegressiva = setInterval(() => {
            // Calcular minutos e segundos
            let minutos = Math.floor(tempoRestante / 60);
            let segundos = tempoRestante % 60;

            // Formatar para sempre ter dois dígitos (ex: 05 em vez de 5)
            minutos = minutos < 10 ? '0' + minutos : minutos;
            segundos = segundos < 10 ? '0' + segundos : segundos;

            // Atualizar o texto na tela
            display.textContent = `${minutos}:${segundos}`;

            // Diminuir 1 segundo do tempo restante
            tempoRestante--;

            // Quando o tempo acabar
            if (tempoRestante < 0) {
                clearInterval(contagemRegressiva); // Para o contador
                display.textContent = "Tempo Esgotado!";
                display.style.color = "#ff4757"; // Muda a cor para vermelho
            }
        }, 1000); // 1000 milissegundos = 1 segundo
    </script>

</body>
</html>
